# EXPLORATORY, outside the pre-specified protocol (requested by a reviewer): DALO-CP's age scale on TRACE. Seeds as in M5.
name: m5x_trace_tau_p
alpha: 0.1
dataset:
  use: trace
  partition: P
delay:
  type: real
shifts: []
eval:
  window: 100
  burn_in: 500
runtime:
  log_every: 2000
methods:
- type: dalo_cp
  eta_rel: 0.05
  window: 250
  age_tau: 25
  arrival_ipw: true
  borrow:
